<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ROO SSOT standing map</title>
<style>
:root { color-scheme: dark; --bg:#0e1218; --panel:#151b24; --line:#2a3140; --text:#e7e3d6; --muted:#9aa3b2; --accent:#f2c14e; --left:#7eb6ff; --right:#f1948a; }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 "Segoe UI",system-ui,sans-serif}
header{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:15px;margin:0;font-weight:600}
header button,header select{background:#1b212b;color:inherit;border:1px solid #3a4456;border-radius:6px;padding:6px 10px;cursor:pointer}
header button.on{border-color:var(--accent);color:var(--accent)}
#main{display:grid;grid-template-columns:1fr 340px;height:calc(100vh - 88px)}
#stage{position:relative;overflow:hidden;border-right:1px solid var(--line)}
#panel{background:var(--panel);padding:12px 14px;overflow:auto}
#panel h2{font-size:13px;margin:0 0 8px;color:var(--accent)}
#panel h3{font-size:12px;margin:12px 0 4px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
#panel .empty{color:var(--muted);font-style:italic}
#panel .item{padding:6px 8px;border:1px solid var(--line);border-radius:6px;margin:4px 0;cursor:pointer}
#panel .item:hover{border-color:#556}
#panel .meta{color:var(--muted);font-size:12px}
footer{padding:6px 14px;color:var(--muted);font-size:12px;border-top:1px solid var(--line)}
/* Landing V */
#landing{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.vwrap{position:relative;width:min(920px,96%);height:min(640px,90%)}
.rail{position:absolute;display:flex;flex-direction:column;gap:8px;width:42%}
.rail.left{left:0;top:0;bottom:48px;align-items:flex-end}
.rail.right{right:0;top:0;bottom:48px;align-items:flex-start}
.level{width:78%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#121821;cursor:pointer;text-align:left}
.rail.left .level{border-color:#355078;text-align:right}
.rail.right .level{border-color:#6a3a3a}
.level:hover{border-color:var(--accent)}
.level b{display:block;font-size:13px}
.level span{color:var(--muted);font-size:11px}
.coding{position:absolute;left:50%;bottom:0;transform:translateX(-50%);padding:12px 22px;border-radius:999px;background:#1a1520;border:1px solid var(--accent);color:var(--accent);font-weight:600}
svg.vlines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
/* Level list overlay */
#levelView,#focusView,#worldView{position:absolute;inset:0;display:none;flex-direction:column;background:var(--bg)}
#levelView.on,#focusView.on,#worldView.on{display:flex}
.toolbar{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.toolbar .grow{flex:1}
.list{overflow:auto;padding:10px 12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}
.card{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#121821;cursor:pointer}
.card:hover{border-color:#667}
.card .id{font-family:ui-monospace,monospace;font-size:12px;color:var(--accent)}
.donutwrap{display:flex;gap:16px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}
canvas#donut{width:72px;height:72px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{font-size:12px}
#focusCanvas,#worldCanvas{flex:1;width:100%;display:block;background:#0b0f14;cursor:grab}
#focusCanvas.drag,#worldCanvas.drag{cursor:grabbing}
.badge{display:inline-block;padding:1px 6px;border-radius:999px;background:#243044;font-size:11px;margin-left:4px}
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
</style>
</head>

function drawDonut(items){
  const c=countBy(items,n=>n.status||'not run');
  const order=['passed','failed','skipped','not run'];
  const canvas=document.getElementById('donut'); const ctx=canvas.getContext('2d');
  const total=items.length||1; let a=-Math.PI/2;
  ctx.clearRect(0,0,72,72);
  for(const k of order){
    const n=c[k]||0; if(!n) continue;
    const slice=n/total*Math.PI*2;
    ctx.beginPath(); ctx.moveTo(36,36); ctx.arc(36,36,32,a,a+slice); ctx.closePath();
    ctx.fillStyle=STATUS_COLORS[k]; ctx.fill(); a+=slice;
  }
  ctx.beginPath(); ctx.arc(36,36,18,0,Math.PI*2); ctx.fillStyle='#0e1218'; ctx.fill();
  document.getElementById('donutLegend').innerHTML = order.map(k=>`<div><i class="sw" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${STATUS_COLORS[k]};margin-right:6px"></i>${k}: ${c[k]||0}</div>`).join('');
}

function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function neighborsForFocus(id){
  // Focus neighborhood via functions that mention the node, per skill
  const n=byId[id]; if(!n) return {center:id, nodes:new Set([id]), edges:[]};
  let fncs=new Set();
  if(n.kind==='FNC') fncs.add(id);
  else {
    // functions that mention it
    for(const f of DATA.nodes.filter(x=>x.kind==='FNC')){
      if((f.implements||[]).includes(id)) fncs.add(f.id);
    }
    for(const e of (inn[id]||[])) if(e.type==='implements' && kindOf(e.from)==='FNC') fncs.add(e.from);
    for(const e of (out[id]||[]).concat(inn[id]||[])){
      if(kindOf(e.from)==='FNC') fncs.add(e.from);
      if(kindOf(e.to)==='FNC') fncs.add(e.to);
    }
    if(n.kind==='API'){
      for(const e of (out[id]||[])) if(e.type==='depends_on' && kindOf(e.to)==='FNC') fncs.add(e.to);
    }
    if(n.kind==='CMP'){
      for(const e of (inn[id]||[])) if(e.type==='allocated_to' && kindOf(e.from)==='FNC') fncs.add(e.from);
    }
    if(n.kind==='UNT'){
      for(const e of (out[id]||[])) if(e.type==='refines' && kindOf(e.to)==='FNC') fncs.add(e.to);
      for(const r of (n.refines||[])) if(kindOf(r)==='FNC') fncs.add(r);
    }
    if(n.kind==='TST'){
      for(const v of (n.verifies||[])) if(kindOf(v)==='FNC') fncs.add(v);
      for(const e of (out[id]||[])) if(e.type==='verifies' && kindOf(e.to)==='FNC') fncs.add(e.to);
    }
    if(n.kind==='REQ' || n.kind==='USR'){
      for(const e of (inn[id]||[])) if(e.type==='implements' && kindOf(e.from)==='FNC') fncs.add(e.from);
      if(n.kind==='USR'){
        // via linked REQs
        for(const r of DATA.nodes.filter(x=>x.kind==='REQ' && x.linked_from===id)){
          for(const e of (inn[r.id]||[])) if(e.type==='implements' && kindOf(e.from)==='FNC') fncs.add(e.from);
        }
      }
    }
  }
  const nodeSet=new Set([id, ...fncs]);
  const edgeList=[];
  function addE(e){ edgeList.push(e); nodeSet.add(e.from); nodeSet.add(e.to); }
  for(const fid of fncs){
    // REQs it implements
    for(const e of (out[fid]||[])) if(e.type==='implements' && kindOf(e.to)==='REQ') addE(e);
    const fn=byId[fid];
    for(const r of (fn?.implements||[])) if(byId[r]) { nodeSet.add(r); edgeList.push({type:'implements',from:fid,to:r}); }
    // APIs that depends_on it
    for(const e of (inn[fid]||[])) if(e.type==='depends_on' && kindOf(e.from)==='API') addE(e);
    // INTs whose implements_fnc is it (listed for connections but INT not a focus ring)
    for(const inode of DATA.nodes.filter(x=>x.kind==='INT' && x.implements_fnc===fid)){
      nodeSet.add(inode.id);
      edgeList.push({type:'implements_fnc',from:inode.id,to:fid});
    }
    // allocated_to CMP
    let alloc=null;
    for(const e of (out[fid]||[])) if(e.type==='allocated_to' && kindOf(e.to)==='CMP'){ addE(e); alloc=e.to; }
    // units refines to fnc; part_of only when unit's component is allocated one
    for(const e of (inn[fid]||[])){
      if(e.type==='refines' && kindOf(e.from)==='UNT'){
        addE(e);
        const u=byId[e.from];
        if(u && alloc && u.part_of===alloc){
          edgeList.push({type:'part_of',from:u.id,to:alloc});
          nodeSet.add(alloc);
        }
      }
    }
    // also node.refines lists
    for(const u of DATA.nodes.filter(x=>x.kind==='UNT')){
      if((u.refines||[]).includes(fid)){
        nodeSet.add(u.id);
        edgeList.push({type:'refines',from:u.id,to:fid});
        if(alloc && u.part_of===alloc){ edgeList.push({type:'part_of',from:u.id,to:alloc}); nodeSet.add(alloc); }
      }
    }
    // tests verifies to fnc, its units, or its reqs
    const okTargets=new Set([fid]);
    for(const e of edgeList){
      if(e.type==='implements' && e.from===fid) okTargets.add(e.to);
      if(e.type==='refines' && e.to===fid) okTargets.add(e.from);
    }
    for(const t of DATA.nodes.filter(x=>x.kind==='TST')){
      const targets=new Set([...(t.verifies||[])]);
      for(const e of (out[t.id]||[])) if(e.type==='verifies') targets.add(e.to);
      for(const tgt of targets){
        if(okTargets.has(tgt)){
          nodeSet.add(t.id); nodeSet.add(tgt);
          edgeList.push({type:'verifies',from:t.id,to:tgt});
        }
      }
    }
  }
  // Always include center
  nodeSet.add(id);
  // Dedupe edges
  const seen=new Set(); const edges=[];
  for(const e of edgeList){
    const k=e.type+'|'+e.from+'|'+e.to; if(seen.has(k)) continue; seen.add(k); edges.push(e);
  }
  return {center:id, nodes:nodeSet, edges};
}
function kindOf(id){ return (id||'').split('-')[0]; }

function openFocus(id){
  if(!byId[id]) return;
  focusId=id; focusTab='Connections';
  show('focus');
  document.getElementById('focusTitle').textContent=id+' — '+byId[id].title.slice(0,80);
  const nb=neighborsForFocus(id);
  const counts={Connections: nb.edges.length};
  for(const k of RING){ counts[k]=[...nb.nodes].filter(x=>kindOf(x)===k).length; }
  const tabs=document.getElementById('focusTabs'); tabs.innerHTML='';
  for(const t of ['Connections',...RING]){
    const b=document.createElement('button'); b.type='button'; b.textContent=`${t} (${counts[t]||0})`;
    if(t===focusTab) b.className='on';
    b.onclick=()=>{ focusTab=t; [...tabs.children].forEach(x=>x.classList.remove('on')); b.className='on'; drawFocus(nb); fillFocusPanel(id, nb); };
    tabs.appendChild(b);
  }
  drawFocus(nb);
  fillFocusPanel(id, nb);
  goto.value=id;
}

function fillFocusPanel(id, nb){
  const n=byId[id];
  let html=`<div class="meta">${escapeHtml(n.kind)} · ${escapeHtml(n.domain||'')}</div><p>${escapeHtml(n.title)}</p>`;
  if(n.kind==='REQ'||n.kind==='USR'){
    const fncs=[...nb.nodes].filter(x=>kindOf(x)==='FNC');
    html+=`<h3>Satisfied by</h3>`+(fncs.length?fncs.map(f=>`<div class="item" data-id="${f}">${f} — ${escapeHtml(byId[f].title)}</div>`).join(''):`<div class="empty">no functions allocated to this need.</div>`);
  } else if(n.kind==='FNC'){
    const cmps=[...nb.nodes].filter(x=>kindOf(x)==='CMP');
    const unts=[...nb.nodes].filter(x=>kindOf(x)==='UNT');
    const reqs=[...nb.nodes].filter(x=>kindOf(x)==='REQ');
    html+=`<h3>Allocated to</h3>`+(cmps.length?cmps.map(f=>`<div class="item" data-id="${f}">${f}</div>`).join(''):`<div class="empty">no component allocated to this function.</div>`);
    html+=`<h3>Refined by</h3>`+(unts.length?unts.map(f=>`<div class="item" data-id="${f}">${f}</div>`).join(''):`<div class="empty">no units refine this function.</div>`);
    html+=`<h3>Satisfies</h3>`+(reqs.length?reqs.map(f=>`<div class="item" data-id="${f}">${f}</div>`).join(''):`<div class="empty">no requirements linked.</div>`);
  } else if(n.kind==='CMP'){
    const fncs=[...nb.nodes].filter(x=>kindOf(x)==='FNC');
    const unts=[...nb.nodes].filter(x=>kindOf(x)==='UNT');
    html+=`<h3>Functions</h3>`+(fncs.length?fncs.map(f=>`<div class="item" data-id="${f}">${f}</div>`).join(''):`<div class="empty">no functions.</div>`);
    html+=`<h3>Parts</h3>`+(unts.length?unts.map(f=>`<div class="item" data-id="${f}">${f}</div>`).join(''):`<div class="empty">no parts.</div>`);
    html+=`<h3>Ports</h3><div class="empty">ports not modeled as separate nodes.</div>`;
  } else if(n.kind==='API'){
    const fncs=[...nb.nodes].filter(x=>kindOf(x)==='FNC');
    html+=`<h3>Connects</h3>`+(fncs.length?fncs.map(f=>`<div class="item" data-id="${f}">${f}</div>`).join(''):`<div class="empty">no function link.</div>`);
    const users=[...nb.nodes].filter(x=>kindOf(x)==='INT'||kindOf(x)==='UNT');
    html+=`<h3>Used by</h3>`+(users.length?users.map(f=>`<div class="item" data-id="${f}">${f}</div>`).join(''):`<div class="empty">no published consumers in this neighborhood.</div>`);
  } else if(n.kind==='UNT'){
    const files=n.source_files||[];
    if(!files.length) html+=`<h3>Source</h3><div class="empty">no source files on this unit yet.</div>`;
    else html+=`<h3>Source</h3>`+files.map(f=>`<div class="meta">${escapeHtml(f)}</div>`).join('')+`<div class="empty">snippet omitted unless the published path can be read in-page.</div>`;
  } else if(n.kind==='TST'){
    html+=`<div class="meta">level ${escapeHtml(n.level)} · ${escapeHtml(n.status)} · ${n.cases||0} cases</div>`;
    html+=`<h3>Verifies</h3>`+(n.verifies||[]).map(v=>`<div class="item" data-id="${v}">${v}</div>`).join('')||`<div class="empty">none</div>`;
  } else if(n.kind==='INT'){
    html+=`<div class="meta">implements_fnc ${escapeHtml(n.implements_fnc||'')}</div>`;
  }
  setPanel(id, html);
  document.getElementById('panelBody').querySelectorAll('.item').forEach(el=>{
    el.onclick=()=>openFocus(el.getAttribute('data-id'));
  });
}

function drawFocus(nb){
  const canvas=document.getElementById('focusCanvas');
  const rect=canvas.parentElement.getBoundingClientRect();
  const toolbarH=canvas.parentElement.querySelector('.toolbar').offsetHeight;
  canvas.width=rect.width; canvas.height=Math.max(200, rect.height-toolbarH);
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#0b0f14'; ctx.fillRect(0,0,canvas.width,canvas.height);
  const cx=canvas.width/2, cy=canvas.height/2;
  const ringIds={};
  for(const k of RING) ringIds[k]=[...nb.nodes].filter(id=>kindOf(id)===k).sort();
  // If tab filters, dim others
  const colors={REQ:'#7eb6ff',FNC:'#f2c14e',API:'#7dcea0',CMP:'#e59866',UNT:'#c39bd3',TST:'#f1948a',USR:'#85c1e9',INT:'#76d7c4'};
  const pos={};
  pos[nb.center]={x:cx,y:cy};
  RING.forEach((k,i)=>{
    const ids=ringIds[k]; const R=70+i*48;
    ids.forEach((id,j)=>{
      const a=-Math.PI/2 + (j/Math.max(ids.length,1))*Math.PI*2;
      pos[id]={x:cx+Math.cos(a)*R, y:cy+Math.sin(a)*R};
    });
  });
  // place leftover kinds near center ring
  for(const id of nb.nodes){
    if(pos[id]) continue;
    const a=Math.random()*Math.PI*2; pos[id]={x:cx+Math.cos(a)*40,y:cy+Math.sin(a)*40};
  }
  const showEdge=(e)=>{
    if(focusTab==='Connections') return true;
    return kindOf(e.from)===focusTab || kindOf(e.to)===focusTab || e.from===nb.center || e.to===nb.center;
  };
  for(const e of nb.edges){
    if(!showEdge(e)) continue;
    const a=pos[e.from], b=pos[e.to]; if(!a||!b) continue;
    ctx.strokeStyle='#2a3140'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
  }
  for(const id of nb.nodes){
    if(focusTab!=='Connections' && kindOf(id)!==focusTab && id!==nb.center) continue;
    const p=pos[id]; const k=kindOf(id);
    ctx.beginPath(); ctx.arc(p.x,p.y, id===nb.center?10:6, 0, Math.PI*2);
    ctx.fillStyle=colors[k]||'#aaa'; ctx.fill();
    ctx.fillStyle='#cfd5df'; ctx.font='10px sans-serif';
    ctx.fillText(id, p.x+8, p.y+3);
  }
  canvas.onclick=(ev)=>{
    const r=canvas.getBoundingClientRect();
    const x=ev.clientX-r.left, y=ev.clientY-r.top;
    let best=null, bd=1e9;
    for(const id of nb.nodes){
      const p=pos[id]; const d=(p.x-x)**2+(p.y-y)**2;
      if(d<bd && d<14*14){ bd=d; best=id; }
    }
    if(best) openFocus(best);
  };
}

// World
const WORLD_HUBS_LEFT=['REQ','FNC','API','CMP','UNT'];
const WORLD_HUBS_RIGHT=['acceptance','system','integration','unit'];
let worldCam={x:0,y:0,s:1};
let worldPos={};

function layoutWorld(){
  worldPos={};
  const W=1600, H=1000;
  // left hubs
  WORLD_HUBS_LEFT.forEach((k,i)=>{
    const hx=350, hy=80+i*((H-120)/(WORLD_HUBS_LEFT.length-1||1));
    worldPos['HUB:'+k]={x:hx,y:hy,hub:true,label:k};
    const ids=DATA.nodes.filter(n=>n.kind===k).map(n=>n.id);
    ids.forEach((id,j)=>{
      const col=j%8, row=Math.floor(j/8);
      worldPos[id]={x:hx-40-col*18, y:hy-30+row*10};
    });
  });
  WORLD_HUBS_RIGHT.forEach((lvl,i)=>{
    const hx=1250, hy=80+i*((H-120)/(WORLD_HUBS_RIGHT.length-1||1));
    worldPos['HUB:'+lvl]={x:hx,y:hy,hub:true,label:lvl};
    const ids=DATA.nodes.filter(n=>n.kind==='TST' && (n.level||'unit')===lvl).map(n=>n.id);
    ids.forEach((id,j)=>{
      const col=j%8, row=Math.floor(j/8);
      worldPos[id]={x:hx+40+col*18, y:hy-30+row*10};
    });
  });
  // coding point
  worldPos['HUB:Coding']={x:W/2,y:H-40,hub:true,label:'Coding'};
}

function drawWorld(){
  const canvas=document.getElementById('worldCanvas');
  const rect=canvas.parentElement.getBoundingClientRect();
  const toolbarH=canvas.parentElement.querySelector('.toolbar').offsetHeight;
  canvas.width=rect.width; canvas.height=Math.max(200, rect.height-toolbarH);
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#0b0f14'; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.save();
  ctx.translate(canvas.width/2+worldCam.x, canvas.height/2+worldCam.y);
  ctx.scale(worldCam.s, worldCam.s);
  ctx.translate(-800, -500);
  // rails lines
  ctx.strokeStyle='#355078'; ctx.beginPath(); ctx.moveTo(350,80); ctx.lineTo(800,960); ctx.stroke();
  ctx.strokeStyle='#6a3a3a'; ctx.beginPath(); ctx.moveTo(1250,80); ctx.lineTo(800,960); ctx.stroke();
  const colors={REQ:'#7eb6ff',FNC:'#f2c14e',API:'#7dcea0',CMP:'#e59866',UNT:'#c39bd3',TST:'#f1948a'};
  let connEdges=[];
  if(worldShowConn && worldFrozen){
    const nb=neighborsForFocus(worldFrozen);
    connEdges=nb.edges;
    for(const e of connEdges){
      const a=worldPos[e.from], b=worldPos[e.to]; if(!a||!b) continue;
      ctx.strokeStyle='#f2c14e88'; ctx.lineWidth=1.2; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
    }
  }
  for(const [id,p] of Object.entries(worldPos)){
    if(p.hub){
      ctx.fillStyle='#1a1520'; ctx.strokeStyle='#f2c14e'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.arc(p.x,p.y,16,0,Math.PI*2); ctx.fill(); ctx.stroke();
      ctx.fillStyle='#f2c14e'; ctx.font='12px sans-serif'; ctx.fillText(p.label, p.x+20, p.y+4);
      continue;
    }
    const k=kindOf(id);
    ctx.beginPath(); ctx.arc(p.x,p.y, worldFrozen===id?5:2.5, 0, Math.PI*2);
    ctx.fillStyle=colors[k]||'#888'; ctx.fill();
  }
  ctx.restore();
  document.getElementById('worldFrozen').textContent = worldFrozen ? (`frozen ${worldFrozen}` + (worldShowConn?' · connection on':'')) : '';
}

function openWorld(){
  show('world'); layoutWorld(); drawWorld();
  setPanel('World', `<p class="meta">Hubs on the V. USR and INT stay on landing lists only — not World hubs. Goto freezes a node as focus. See connection draws that node's traced neighbors.</p>`);
}

// pan zoom world
(() => {
  const canvas=document.getElementById('worldCanvas');
  let drag=false, lx=0, ly=0;
  canvas.addEventListener('mousedown', e=>{ drag=true; canvas.classList.add('drag'); lx=e.clientX; ly=e.clientY; });
  window.addEventListener('mouseup', ()=>{ drag=false; canvas.classList.remove('drag'); });
  window.addEventListener('mousemove', e=>{
    if(!drag || mode!=='world') return;
    worldCam.x += e.clientX-lx; worldCam.y += e.clientY-ly; lx=e.clientX; ly=e.clientY; drawWorld();
  });
  canvas.addEventListener('wheel', e=>{
    if(mode!=='world') return; e.preventDefault();
    const f=e.deltaY<0?1.1:0.9; worldCam.s=Math.min(4, Math.max(0.3, worldCam.s*f)); drawWorld();
  }, {passive:false});
  canvas.addEventListener('click', e=>{
    if(mode!=='world') return;
    const r=canvas.getBoundingClientRect();
    const x=(e.clientX-r.left - canvas.width/2 - worldCam.x)/worldCam.s + 800;
    const y=(e.clientY-r.top - canvas.height/2 - worldCam.y)/worldCam.s + 500;
    let best=null, bd=1e9;
    for(const [id,p] of Object.entries(worldPos)){
      if(p.hub) continue;
      const d=(p.x-x)**2+(p.y-y)**2;
      if(d<bd && d<64){ bd=d; best=id; }
    }
    if(best){ worldFrozen=best; drawWorld(); setPanel(best, `<p>${escapeHtml(byId[best].title)}</p><button type="button" id="worldGotoFocus">Open focus</button>`);
      document.getElementById('worldGotoFocus').onclick=()=>openFocus(best);
    }
  });
})();

document.getElementById('btnWorld').onclick=()=>openWorld();
document.getElementById('backLanding').onclick=()=>{ show('landing'); renderLanding(); };
document.getElementById('backWorldLanding').onclick=()=>{ show('landing'); renderLanding(); };

};
document.getElementById('btnSeeConn').onclick=()=>{ if(worldFrozen){ worldShowConn=true; drawWorld(); } };
document.getElementById('btnHideConn').onclick=()=>{ worldShowConn=false; drawWorld(); };

show('landing');
renderLanding();
window.addEventListener('resize', ()=>{ if(mode==='focus'&&focusId) openFocus(focusId); if(mode==='world') drawWorld(); });
